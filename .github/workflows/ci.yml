name: AccelServe CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch

      - name: Run tests
        env:
          ACCELSERVE_BACKEND: pytorch
        run: |
          python -m compileall -q api inference benchmarks tests
          python -m pytest -v

      - name: Build and run C++ baseline
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ./build/cpu_vector_add

      - name: Build CPU container
        run: docker build --file docker/Dockerfile --tag accelserve:ci .
