[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accelserve"
version = "0.5.0"
description = "Reference AI inference runtime with explicit KV caching and continuous batching"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "torch>=2.5,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["accelserve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
